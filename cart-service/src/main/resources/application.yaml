spring:
  application:
    name: cart-service

  datasource:
    url: jdbc:postgresql://localhost:5432/cart_service
    username: postgres
    password: 12345678
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8084

services:
  product:
    url: http://localhost:8082

springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html


